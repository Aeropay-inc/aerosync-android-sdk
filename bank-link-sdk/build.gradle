plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-parcelize'
}

ext {
    PUBLISH_GROUP_ID = 'com.aerosync'
    PUBLISH_VERSION = '3.0.0'
    PUBLISH_ARTIFACT_ID = 'bank-link-sdk'
}

apply from: "${rootProject.projectDir}/scripts/publish-module.gradle"

android {
    namespace 'com.aerosync.bank_link_sdk'
    compileSdk 33

    defaultConfig {
        minSdk 24
        targetSdk 33
        resValue "string", "host_name", "bank-link"
        resValue "string", "app_scheme", "aerosync"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {

    implementation 'androidx.core:core-ktx:1.8.0'
    // api: Widget's public constructors take ComponentActivity / Fragment
    api 'androidx.activity:activity:1.6.1'
    api 'androidx.fragment:fragment:1.5.7'
    testImplementation 'junit:junit:4.13.2'
    // real org.json for unit tests (android.jar only has stubs)
    testImplementation 'org.json:json:20231013'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}